<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skybox fijo HDR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
#info{position:fixed;left:14px;bottom:14px;padding:8px 11px;
background:rgba(0,0,0,.55);color:#fff;font:12px Arial;border-radius:8px}
</style>
</head>
<body>
<div id="info">Arrastra para mirar · rueda para zoom</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75, innerWidth / innerHeight, 0.01, 1000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

// Sin tonemapping de Three.js.
// La conversión final la hacemos en nuestro shader.
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 0;

document.body.appendChild(renderer.domElement);

// --------------------------------------------------
// POSTPROCESADO: EXPOSICIÓN 0 + GAMMA 2
// --------------------------------------------------

const composer = new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene, camera)
);

const colorPass = new ShaderPass({
    uniforms:{
        tDiffuse:{value:null},
        exposure:{value:0.0},
        gamma:{value:2.0}
    },

    vertexShader:`
        varying vec2 vUv;

        void main(){
            vUv = uv;

            gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(position,1.0);
        }
    `,

    fragmentShader:`
        uniform sampler2D tDiffuse;
        uniform float exposure;
        uniform float gamma;

        varying vec2 vUv;

        void main(){

            vec3 color =
                texture2D(tDiffuse,vUv).rgb;

            // Exposición.
            color *= pow(2.0, exposure);

            // Gamma 2.0.
            color =
                pow(
                    max(color,vec3(0.0)),
                    vec3(1.0/gamma)
                );

            gl_FragColor =
                vec4(color,1.0);
        }
    `
});

composer.addPass(colorPass);

// --------------------------------------------------
// TUS 6 IMÁGENES
// --------------------------------------------------

const files = [
    "panoramahdr_3.hdr", // PX +X
    "panoramahdr_1.hdr", // NX -X
    "panoramahdr_4.hdr", // PY +Y
    "panoramahdr_5.hdr", // NY -Y
    "panoramahdr_0.hdr", // PZ +Z
    "panoramahdr_2.hdr"  // NZ -Z
];

const loader = new RGBELoader();

function loadHDR(file){

    return new Promise((resolve,reject)=>{

        loader.load(
            file,

            texture=>{

                texture.colorSpace =
                    THREE.LinearSRGBColorSpace;

                // Corrección horizontal X.
                texture.wrapS =
                    THREE.RepeatWrapping;

                texture.repeat.x = -1;
                texture.offset.x = 1;

                texture.needsUpdate = true;

                resolve(texture);
            },

            undefined,

            reject
        );

    });
}

// --------------------------------------------------
// CREAR SKYBOX
// --------------------------------------------------

async function createSkybox(){

    try{

        const textures =
            await Promise.all(
                files.map(loadHDR)
            );

        /*
         * BoxGeometry:
         *
         * 0 PX
         * 1 NX
         * 2 PY
         * 3 NY
         * 4 PZ
         * 5 NZ
         */

        const geometry =
            new THREE.BoxGeometry(
                100,100,100
            );

        const materials =
            textures.map(texture =>
                new THREE.MeshBasicMaterial({
                    map:texture,
                    side:THREE.BackSide,

                    // Muy importante:
                    // el shader se encarga del color final.
                    toneMapped:false
                })
            );

        const skybox =
            new THREE.Mesh(
                geometry,
                materials
            );

        scene.add(skybox);

    }catch(error){

        console.error(error);

        document.getElementById("info").textContent =
            "Error cargando el skybox. Mira la consola (F12).";
    }
}

createSkybox();

// --------------------------------------------------
// CÁMARA
// --------------------------------------------------

let yaw=0;
let pitch=0;
let dragging=false;

let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        lastX=e.clientX;
        lastY=e.clientY;

        renderer.domElement.setPointerCapture(
            e.pointerId
        );
    }
);

renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)return;

        const dx =
            e.clientX-lastX;

        const dy =
            e.clientY-lastY;

        lastX=e.clientX;
        lastY=e.clientY;

        yaw -= dx*0.005;
        pitch -= dy*0.005;

        const limit =
            Math.PI/2-0.01;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -limit,
                limit
            );
    }
);

renderer.domElement.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);

renderer.domElement.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        camera.fov +=
            e.deltaY*0.04;

        camera.fov =
            THREE.MathUtils.clamp(
                camera.fov,
                30,
                110
            );

        camera.updateProjectionMatrix();

    },
    {passive:false}
);

// --------------------------------------------------
// RESIZE
// --------------------------------------------------

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        composer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

// --------------------------------------------------
// RENDER
// --------------------------------------------------

function animate(){

    requestAnimationFrame(
        animate
    );

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

    composer.render();
}

animate();

</script>
</body>
</html>
